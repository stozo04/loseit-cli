name: Deploy to ClawHub (from branch)

# Manual, branch-aware ClawHub publish.
#
# The other workflow ("Publish to ClawHub") fires automatically when SKILL.md
# lands on main — that's the production publish. THIS one is triggered by hand
# from the Actions tab so you can run ClawHub's security scan against a PR /
# feature branch WITHOUT merging to main: open Actions → "Deploy to ClawHub (from
# branch)" → Run workflow → pick the branch in the dropdown.
#
# target=scan-copy (default) publishes to a throwaway slug named after this run
# (loseit-scan-<run id>-<attempt>), waits for the scan, saves the verdict to the
# run summary and the full report as an artifact, then deletes the copy so
# test listings never pile up on ClawHub. If the report can't be saved the copy
# stays for inspection, and the weekly sweep removes it later. target=live
# republishes the real loseit listing from the chosen branch and
# leaves it in place without waiting for the scan.
#
# Note: the "Run workflow" button only appears once this file is on the default
# branch (main). The run publishes the SKILL.md of whichever branch you select.
on:
  workflow_dispatch:
    inputs:
      target:
        description: >-
          scan-copy runs the scan on a throwaway copy and deletes it afterwards;
          live overwrites the real loseit listing.
        type: choice
        options: [scan-copy, live]
        default: scan-copy

permissions:
  contents: read

concurrency:
  group: ${{ inputs.target == 'live' && 'clawhub-publish-live' || format('clawhub-scan-copy-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

env:
  SLUG: ${{ inputs.target == 'live' && 'loseit' || format('loseit-scan-{0}-{1}', github.run_id, github.run_attempt) }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # No `ref:` — checkout defaults to github.ref, i.e. the branch chosen in the
      # Run workflow dropdown, so we publish THAT branch's SKILL.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Summarize what will be published
        # Values pass through env, never interpolated straight into the script, so
        # a branch name can't inject shell.
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TARGET: ${{ inputs.target }}
          ACTOR: ${{ github.actor }}
        run: |
          {
            echo "### Deploy to ClawHub (manual)"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Branch / ref | \`$REF\` |"
            echo "| Commit | \`$SHA\` |"
            echo "| Target | \`$TARGET\` |"
            echo "| Slug | \`$SLUG\` |"
            echo "| Triggered by | @$ACTOR |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install clawhub CLI
        run: npm install -g clawhub@0.26.0

      - name: Check the skill bundle
        run: node scripts/check-clawhub-bundle.mjs

      - name: Authenticate clawhub
        run: clawhub login --token "$CLAWHUB_TOKEN"
        env:
          # Same per-repo secret the auto-publish workflow uses.
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN_LOSEIT }}

      - name: Publish skill
        id: publish
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -o pipefail
          scripts/publish-clawhub.sh "$SLUG" stozo04 "Lose It Nutrition" | tee "$RUNNER_TEMP/publish-output.txt"
          if [[ "$TARGET" == "scan-copy" ]]; then
            published=$(scripts/clawhub-scan-copies.sh version "$SLUG" < "$RUNNER_TEMP/publish-output.txt")
            echo "version=$published" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the ClawHub scan
        if: ${{ inputs.target == 'scan-copy' }}
        env:
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          set -o pipefail
          echo "### ClawHub scan" >> "$GITHUB_STEP_SUMMARY"
          scripts/clawhub-scan-copies.sh await "$SLUG" "$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Download the scan report
        if: ${{ !cancelled() && inputs.target == 'scan-copy' && steps.publish.outputs.version != '' }}
        env:
          VERSION: ${{ steps.publish.outputs.version }}
        run: clawhub scan download "$SLUG" --version "$VERSION" -o clawhub-scan-report.zip

      - name: Keep the scan report
        id: keep-report
        if: ${{ !cancelled() && inputs.target == 'scan-copy' && hashFiles('clawhub-scan-report.zip') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clawhub-scan-report
          path: clawhub-scan-report.zip

      - name: Delete the scan copy
        if: ${{ always() && inputs.target == 'scan-copy' && (cancelled() || steps.publish.outputs.version == '' || steps.keep-report.outcome == 'success') }}
        run: scripts/clawhub-scan-copies.sh delete "$SLUG"

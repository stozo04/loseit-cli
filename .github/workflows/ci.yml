name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Check agent skills
        run: make check-agents
      - name: Build
        run: go build ./...
      - name: Test (race)
        run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          # Pin the linter's toolchain to the module's Go version so it matches
          # the official golangci-lint release binary (built with go1.24). Using
          # a newer toolchain (e.g. stable/go1.26) makes golangci-lint v2.1.6
          # panic: "file requires newer Go version go1.26 (built with go1.24)".
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.1.6

  clawhub-bundle:
    name: clawhub bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install clawhub CLI
        run: npm install -g clawhub@0.26.0
      - name: Check the skill bundle
        run: make check-clawhub

name: Publish to ClawHub

on:
  push:
    branches: [main]
    paths:
      - SKILL.md
      - LICENSE
      - config.example.json
      - .clawhubignore
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-clawhub
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install clawhub CLI
        run: npm install -g clawhub@0.26.0

      - name: Check the skill bundle
        run: node scripts/check-clawhub-bundle.mjs

      - name: Authenticate clawhub
        run: clawhub login --token "$CLAWHUB_TOKEN"
        env:
          # Per-repo secret (the google-health/speediance token does not carry
          # over). Owner adds CLAWHUB_TOKEN_LOSEIT to this repo's secrets.
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN_LOSEIT }}

      - name: Publish skill
        run: clawhub skill publish . --owner stozo04 --slug loseit --name "Lose It Nutrition"
